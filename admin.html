<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGU Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oxanium:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#070814;--card:#101329;--line:#293056;--cyan:#27e8ff;--violet:#8b5cf6;--text:#f4f7ff;--muted:#9ca7c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter}.wrap{width:min(1100px,94%);margin:auto;padding:25px 0}.brand{font:700 27px Oxanium}.brand span{color:var(--cyan)}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(135deg,var(--cyan),var(--violet));font-weight:800;cursor:pointer;color:#06101b}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}h2{font:700 23px Oxanium}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:11px;background:#090c1b;border:1px solid #31395f;color:#fff;border-radius:8px;margin-top:5px}textarea{min-height:90px}.pr{display:grid;grid-template-columns:1fr 150px 42px;gap:8px;margin:7px 0}.danger{background:#401525;color:#ff9bad}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:9px;border-bottom:1px solid #252b4b;text-align:left;font-size:12px}th{color:var(--cyan)}.pill{white-space:pre-line}.msg{padding:11px;border-radius:8px;margin:10px 0}.ok{background:#103522;color:#7dffb1}.err{background:#3a1320;color:#ff9bad}@media(max-width:650px){.row{grid-template-columns:1fr}.pr{grid-template-columns:1fr 100px 40px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">NGU <span>ESPORTZ</span> ADMIN</div><a class="btn" href="/">PUBLIC</a></div><div id="msg"></div>
<section class="card"><h2>⚙ Tournament Settings</h2><form id="settings"><div class="row"><div><label>Title</label><input name="title"></div><div><label>Subtitle</label><input name="subtitle"></div></div><div class="row"><div><label>Type</label><select name="type"><option>Solo</option><option>Duo</option><option>Squad</option></select></div><div><label>Slots</label><input type="number" name="slots" min="1"></div></div><div class="row"><div><label>Entry Fee ₹</label><input type="number" name="entryFee" min="0"></div><div><label>WhatsApp Group Link</label><input name="whatsappLink"></div></div><label>Rules (one per line)</label><textarea name="rules"></textarea><h3>🏆 Prizes — unlimited</h3><div id="prizes"></div><button type="button" class="btn" id="add">+ Add Prize</button><br><br><button class="btn">SAVE SETTINGS</button></form></section>
<section class="card"><h2>👥 Registrations — Full Player Details</h2><button class="btn" id="csv">Export CSV</button><div class="table"><table><thead><tr><th>ID</th><th>Team/Player</th><th>Type</th><th>WhatsApp</th><th>Player 1</th><th>Player 2</th><th>Player 3</th><th>Player 4</th><th>Fee</th><th>Date</th></tr></thead><tbody id="regs"></tbody></table></div></section></div>
<script>
let s={},rs=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function pr(p={label:'',amount:0}){let d=document.createElement('div');d.className='pr';d.innerHTML=`<input class="pl" value="${esc(p.label)}" placeholder="e.g. 4th Prize"><input class="pa" type="number" value="${Number(p.amount||0)}"><button type="button" class="btn danger">×</button>`;d.querySelector('button').onclick=()=>d.remove();prizes.appendChild(d)}
function form(){['title','subtitle','type','slots','entryFee','whatsappLink'].forEach(k=>document.querySelector('[name='+k+']').value=s[k]??'');document.querySelector('[name=rules]').value=(s.rules||[]).join('\\n');prizes.innerHTML='';(s.prizes||[]).forEach(pr);if(!s.prizes?.length)pr()}
function render(){regs.innerHTML=rs.map(r=>{let p=r.players||[];return `<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${r.type}</td><td>${esc(r.whatsapp)}</td>${[0,1,2,3].map(i=>`<td>${esc(p[i]?.name||'—')}<br><span style="color:#27e8ff">${esc(p[i]?.uid||'')}</span></td>`).join('')}<td>₹${Number(r.entryFee||0)}</td><td>${new Date(r.createdAt).toLocaleString()}</td></tr>`}).join('')||'<tr><td colspan="10">No registrations yet.</td></tr>'}
async function load(){s=await fetch('/api/settings').then(r=>r.json());rs=await fetch('/api/registrations').then(r=>r.json());form();render()}add.onclick=()=>pr();
settings.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.slots=+d.slots;d.entryFee=+d.entryFee;d.rules=d.rules.split('\\n').map(x=>x.trim()).filter(Boolean);d.prizes=[...document.querySelectorAll('.pr')].map(x=>({label:x.querySelector('.pl').value.trim(),amount:+x.querySelector('.pa').value||0})).filter(x=>x.label);let r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),o=await r.json();msg.className=r.ok?'msg ok':'msg err';msg.textContent=r.ok?'Saved!':'Error: '+o.error}
csv.onclick=()=>location.href='/api/registrations.csv';load();
</script></body></html>
